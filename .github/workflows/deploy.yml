name: Build and deploy to GitHub Pages

on:
  push:
    # Listed branches get BUILT on every push, which is worth having on its own:
    # it type-checks the change before anybody merges it. Publishing is a
    # separate matter and only the default branch can do it — see the deploy job.
    branches:
      - main
      - claude/psc-pec-reports-portal-trwzfh
      - claude/psc-portal-handoff-4nowh8
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # GitHub Pages serves a project site from /<repo>/, so the bundle needs to
      # know its base path. Derived from GITHUB_REPOSITORY rather than the event
      # payload, so it also works for a manual run. Change this to "/" if the
      # portal later moves to a custom domain served from the root.
      #
      # The base path is baked into the published bundle, so renaming or
      # transferring the repository ALWAYS has to be followed by a fresh run of
      # this workflow. Until it is, the live site still serves index.html asking
      # for /<old-name>/assets/..., every asset 404s and the page renders blank
      # white with no error on screen. That is what happened after the move to
      # stpiusx-psc/portal.
      - name: Work out the base path
        run: echo "VITE_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - run: npm run build
      # Reads the Pages configuration. Pages must already be switched on for the
      # repository, with Settings -> Pages -> Build and deployment -> Source set
      # to "GitHub Actions". Note that `enablement: true` does NOT work here:
      # creating a Pages site needs repository-admin rights, which GITHUB_TOKEN
      # does not have, and the API answers "Resource not accessible by
      # integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Publishing is gated TWICE and the two gates are set in different places.
    #
    # 1. This condition, which is our policy: only the default branch publishes,
    #    so a feature-branch push builds (a useful type-check) and stops there.
    # 2. The github-pages environment's "Deployment branches and tags" rule, in
    #    Settings -> Environments. GitHub writes that rule when Pages is first
    #    switched on, naming whatever the default branch was AT THAT MOMENT, and
    #    it does NOT follow a later change of default branch. Renaming or
    #    switching the default branch therefore leaves a stale rule behind.
    #
    # A branch refused by gate 2 fails in a way that explains nothing: the job
    # is rejected before it starts, so it ends in about a second with no steps,
    # no runner and no log at all. If a push to the default branch builds and
    # then dies like that, gate 2 is the thing to go and look at — not this file.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
